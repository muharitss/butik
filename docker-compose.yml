services:
  postgres:
    image: postgres:16-alpine
    container_name: jahitflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: jahitflow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jahitflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jahitflow-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 4000
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:password@postgres:5432/jahitflow?schema=public
      CORS_ORIGIN: http://localhost:5173,http://localhost:3000
    ports:
      - "4000:4000"

volumes:
  postgres_data:
